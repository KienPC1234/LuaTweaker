plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}" apply false
    id 'dev.architectury.loom' version "${loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadow_version}" apply false
    id 'idea'
    // The root only exists to host the PMD canary; `java` gives the Pmd task the
    // source-set plumbing it needs and produces no artifact (jar is disabled).
    id 'java'
    id 'pmd'
}

tasks.named('jar') {
    enabled = false
}

ext {
    pureJavaModules = [
        ':common-api',
        ':core-engine',
        ':modules:module-recipes',
        ':modules:module-content',
        ':modules:module-entities',
        ':modules:module-interaction',
        ':modules:module-events',
        ':modules:module-math',
        ':modules:module-storage',
        ':modules:module-network',
        ':modules:module-client',
        ':modules:module-interception',
        ':modules:module-command',
        ':modules:module-tasks',
        ':modules:module-loot',
        ':modules:module-worldgen',
        ':modules:module-noise',
        ':modules:module-dimensions',
        ':modules:module-spawnrules',
        ':modules:module-structures',
        ':modules:module-update',
        ':modules:module-integration-api',
        ':modules:module-text'
    ]

    addEmbeddedRuntimeDeps = { org.gradle.api.artifacts.dsl.DependencyHandler deps, String conf ->
        deps.add(conf, "io.github.kienpc1234:luava:${luava_version}")
        deps.add(conf, "org.mongodb:bson:${bson_version}")
        deps.add(conf, "io.github.spair:imgui-java-binding:${imgui_version}")
        deps.add(conf, "io.github.spair:imgui-java-lwjgl3:${imgui_version}") {
            exclude group: 'org.lwjgl'
        }
        deps.add(conf, "io.github.spair:imgui-java-natives-windows:${imgui_version}")
        deps.add(conf, "io.github.spair:imgui-java-natives-linux:${imgui_version}")
        deps.add(conf, "io.github.spair:imgui-java-natives-macos:${imgui_version}")
        deps.add(conf, "org.lwjgl:lwjgl-spvc:${lwjgl_version}") {
            exclude group: 'org.lwjgl'
        }
        deps.add(conf, "org.lwjgl:lwjgl-spvc:${lwjgl_version}:natives-windows")
        deps.add(conf, "org.lwjgl:lwjgl-spvc:${lwjgl_version}:natives-linux")
        deps.add(conf, "org.lwjgl:lwjgl-spvc:${lwjgl_version}:natives-macos")
    }

    registerLoaderLuaSync = { Project loaderProject ->
        def sharedLuaModsDir = rootProject.file('luamods')
        def sharedLuaConfigDir = rootProject.file('luaconfig')

        loaderProject.tasks.register('syncLuaMods', Sync) {
            from sharedLuaModsDir
            into loaderProject.file('run/luamods')
            preserve {
                include '.luatweaker/**'
            }
        }

        loaderProject.tasks.register('syncLuaConfig', Copy) {
            onlyIf { sharedLuaConfigDir.exists() }
            from sharedLuaConfigDir
            into loaderProject.file('run/luaconfig')
        }

        loaderProject.tasks.named('runClient') {
            dependsOn 'syncLuaMods', 'syncLuaConfig'
        }

        loaderProject.tasks.named('runServer') {
            dependsOn 'syncLuaMods', 'syncLuaConfig'
        }
    }
}

pmd {
    toolVersion = pmd_version
    ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
    ruleSets = []
    ignoreFailures = true
    consoleOutput = true
}

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://modmaven.dev' }
        maven { url = 'https://maven.blamejared.com/' }
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// PMD static analysis (dirty-code scan, see config/pmd/ruleset.xml).
// Run: ./gradlew pmdMain pmdTest   (reports: <module>/build/reports/pmd/)
// Both are enforced (ignoreFailures = false): a new finding fails the build.
tasks.register('pmdCanary', org.gradle.api.plugins.quality.Pmd) {
    group = 'verification'
    description = 'Proves config/pmd/ruleset.xml really loads and runs (fails otherwise).'
    source = fileTree(rootProject.file('config/pmd/probe')) { include '**/*.java' }
    ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
    ruleSets = []
    ignoreFailures = true
    reports {
        xml.required.set(true)
        xml.outputLocation.set(rootProject.layout.buildDirectory.file('reports/pmd/canary.xml'))
        html.required.set(false)
    }
}

def canaryProbe = rootProject.file('config/pmd/probe/Probe.java')
def canaryReportFile = rootProject.layout.buildDirectory.file('reports/pmd/canary.xml').get().asFile
tasks.register('pmdCanaryVerify') {
    group = 'verification'
    description = 'Asserts the PMD canary analysis ran and reported the expected finding.'
    dependsOn 'pmdCanary'
    doLast {
        if (!canaryProbe.isFile()) {
            throw new GradleException(
                    "PMD canary failed: ${canaryProbe} is missing, so the gate would prove nothing.")
        }
        if (!canaryReportFile.isFile()) {
            throw new GradleException("PMD canary failed: no report was written to ${canaryReportFile}.")
        }
        def found = new groovy.xml.XmlSlurper(false, false).parse(canaryReportFile)
                .file.violation.collect { it.'@rule'.text() }
        if (found != ['SystemPrintln']) {
            throw new GradleException(
                    "PMD canary failed: expected exactly one SystemPrintln finding in " +
                    "config/pmd/probe/Probe.java but got ${found}. " +
                    "config/pmd/ruleset.xml probably failed to load (PMD reports zero " +
                    "violations in that case) or the canary rule was removed.")
        }
    }
}

subprojects {
    apply plugin: 'pmd'

    pmd {
        toolVersion = pmd_version
        ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
        ruleSets = []
        ignoreFailures = false
        consoleOutput = true
    }

    tasks.withType(org.gradle.api.plugins.quality.Pmd).configureEach {
        dependsOn rootProject.tasks.named('pmdCanaryVerify')
        reports {
            xml.required.set(true)
            html.required.set(true)
        }
    }

    plugins.withId('java') {
        tasks.named('check') {
            dependsOn('pmdMain', 'pmdTest')
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            // Purge transient logs/config directories written to module CWD after the forked TestWorker exits.
            doLast {
                project.delete(
                    project.file('logs'),
                    project.file('luaconfig'),
                    project.file('config/luatweaker.json')
                )
            }
        }
    }
}

// Ensure all subproject jars exist before the IDE sync task runs.
gradle.projectsEvaluated {
    def neoforgeProject = findProject(':neoforge')
    if (neoforgeProject != null) {
        def ideSync = neoforgeProject.tasks.findByName('neoForgeIdeSync')
        if (ideSync != null) {
            subprojects.each { sub ->
                def jarTask = sub.tasks.findByName('jar')
                if (jarTask != null) {
                    ideSync.dependsOn(jarTask)
                }
            }
        }
    }
}
