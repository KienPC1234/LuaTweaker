plugins {
    id 'idea'
}

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://modmaven.dev' }
        maven { url = 'https://maven.blamejared.com/' }
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// PMD static analysis (dirty-code scan, see config/pmd/ruleset.xml).
// Run: ./gradlew pmdMain pmdTest   (reports: <module>/build/reports/pmd/)
// Flip ignoreFailures to false once the baseline is clean so CI rejects new dirt.
subprojects {
    apply plugin: 'pmd'

    pmd {
        toolVersion = pmd_version
        ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
        ruleSets = []
        ignoreFailures = true
        consoleOutput = true
    }

    tasks.withType(org.gradle.api.plugins.quality.Pmd).configureEach {
        reports {
            xml.required.set(true)
            html.required.set(true)
        }
    }

    // PMD runs as part of `check` / `build` in every module.
    plugins.withId('java') {
        tasks.named('check') {
            dependsOn('pmdMain', 'pmdTest')
        }
    }
}


// Ensure all subproject jars exist before the IDE sync task runs.
// This prevents "archive does not exist" classpath errors after a clean build.
gradle.projectsEvaluated {
    def ideSync = project(':neoforge-platform').tasks.findByName('neoForgeIdeSync')
    if (ideSync != null) {
        subprojects.each { sub ->
            def jarTask = sub.tasks.findByName('jar')
            if (jarTask != null) {
                ideSync.dependsOn(jarTask)
            }
        }
    }
}
