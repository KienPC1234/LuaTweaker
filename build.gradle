plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}" apply false
    id 'dev.architectury.loom' version "${loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadow_version}" apply false
    id 'idea'
    // The root only exists to host the PMD canary; `java` gives the Pmd task the
    // source-set plumbing it needs and produces no artifact (jar is disabled).
    id 'java'
    id 'pmd'
}

tasks.named('jar') {
    enabled = false
}

pmd {
    toolVersion = pmd_version
    ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
    ruleSets = []
    ignoreFailures = true
    consoleOutput = true
}

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://modmaven.dev' }
        maven { url = 'https://maven.blamejared.com/' }
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// PMD static analysis (dirty-code scan, see config/pmd/ruleset.xml).
// Run: ./gradlew pmdMain pmdTest   (reports: <module>/build/reports/pmd/)
// Both are enforced (ignoreFailures = false): a new finding fails the build.
// The Gradle PMD task swallows "Cannot load ruleset" and reports ZERO violations,
// which would silently disable the entire gate (verified with a broken rule ref).
// This canary analysis runs the same ruleset over one file that intentionally
// trips exactly one rule. If the ruleset stops loading (or the rule disappears),
// the report comes back empty and the build fails with a clear message instead
// of passing with a green but meaningless result.
tasks.register('pmdCanary', org.gradle.api.plugins.quality.Pmd) {
    group = 'verification'
    description = 'Proves config/pmd/ruleset.xml really loads and runs (fails otherwise).'
    source = fileTree(rootProject.file('config/pmd/probe')) { include '**/*.java' }
    ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
    ruleSets = []
    ignoreFailures = true
    reports {
        xml.required.set(true)
        xml.outputLocation.set(rootProject.layout.buildDirectory.file('reports/pmd/canary.xml'))
        html.required.set(false)
    }
}

// The assertion lives in its own task on purpose: when the probe directory has no
// *.java file, Gradle skips the Pmd task as NO-SOURCE and `doLast` never runs, so a
// deleted/renamed probe would make the canary pass while proving nothing. This task
// always runs and verifies both that the analysis executed and what it reported.
def canaryProbe = rootProject.file('config/pmd/probe/Probe.java')
def canaryReportFile = rootProject.layout.buildDirectory.file('reports/pmd/canary.xml').get().asFile
tasks.register('pmdCanaryVerify') {
    group = 'verification'
    description = 'Asserts the PMD canary analysis ran and reported the expected finding.'
    dependsOn 'pmdCanary'
    doLast {
        // A missing probe makes the Pmd task NO-SOURCE, which silently proves nothing.
        if (!canaryProbe.isFile()) {
            throw new GradleException(
                    "PMD canary failed: ${canaryProbe} is missing, so the gate would prove nothing.")
        }
        if (!canaryReportFile.isFile()) {
            throw new GradleException("PMD canary failed: no report was written to ${canaryReportFile}.")
        }
        def found = new groovy.xml.XmlSlurper(false, false).parse(canaryReportFile)
                .file.violation.collect { it.'@rule'.text() }
        if (found != ['SystemPrintln']) {
            throw new GradleException(
                    "PMD canary failed: expected exactly one SystemPrintln finding in " +
                    "config/pmd/probe/Probe.java but got ${found}. " +
                    "config/pmd/ruleset.xml probably failed to load (PMD reports zero " +
                    "violations in that case) or the canary rule was removed.")
        }
    }
}

subprojects {
    apply plugin: 'pmd'

    pmd {
        toolVersion = pmd_version
        ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
        ruleSets = []
        ignoreFailures = false
        consoleOutput = true
    }

    tasks.withType(org.gradle.api.plugins.quality.Pmd).configureEach {
        dependsOn rootProject.tasks.named('pmdCanaryVerify')
        reports {
            xml.required.set(true)
            html.required.set(true)
        }
    }

    // PMD runs as part of `check` / `build` in every module.
    plugins.withId('java') {
        tasks.named('check') {
            dependsOn('pmdMain', 'pmdTest')
        }
    }
}


// Ensure all subproject jars exist before the IDE sync task runs.
// This prevents "archive does not exist" classpath errors after a clean build.
gradle.projectsEvaluated {
    def neoforgeProject = findProject(':neoforge')
    if (neoforgeProject != null) {
        def ideSync = neoforgeProject.tasks.findByName('neoForgeIdeSync')
        if (ideSync != null) {
            subprojects.each { sub ->
                def jarTask = sub.tasks.findByName('jar')
                if (jarTask != null) {
                    ideSync.dependsOn(jarTask)
                }
            }
        }
    }
}
