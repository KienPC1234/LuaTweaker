plugins {
    id 'idea'
}

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.squiddev.cc' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://modmaven.dev' }
        maven { url = 'https://maven.blamejared.com/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}


// Ensure all subproject jars exist before the IDE sync task runs.
// This prevents "archive does not exist" classpath errors after a clean build.
gradle.projectsEvaluated {
    def ideSync = project(':neoforge-platform').tasks.findByName('neoForgeIdeSync')
    if (ideSync != null) {
        subprojects.each { sub ->
            def jarTask = sub.tasks.findByName('jar')
            if (jarTask != null) {
                ideSync.dependsOn(jarTask)
            }
        }
    }
}
