pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'LuaTweaker'

include 'common-api'
include 'core-engine'
include 'modules:module-recipes'
include 'modules:module-content'
include 'modules:module-entities'
include 'neoforge-platform'
