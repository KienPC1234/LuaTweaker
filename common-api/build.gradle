plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    // Pure Java, no external runtime dependencies, annotations exposed to consumers transitively
    api 'org.jetbrains:annotations:24.1.0'
    // Integration contracts (Geo/JEI specs): pure types, implemented downstream
    api project(':modules:module-integration-api')
}
