plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

// Single source of truth for in-repo modules shipped inside the mod jar.
// MC upgrade = bump gradle.properties only; this list rarely changes.
def ltModuleProjects = [
        ':common-api',
        ':core-engine',
        ':modules:module-recipes',
        ':modules:module-content',
        ':modules:module-entities',
        ':modules:module-interaction',
        ':modules:module-events',
        ':modules:module-math',
        ':modules:module-storage',
        ':modules:module-network',
        ':modules:module-client',
        ':modules:module-interception',
        ':modules:module-command',
        ':modules:module-tasks',
        ':modules:module-loot',
        ':modules:module-worldgen',
        ':modules:module-noise',
        ':modules:module-dimensions',
        ':modules:module-spawnrules',
        ':modules:module-structures',
        ':modules:module-update',
        ':modules:module-integration-api'
]
ltModuleProjects.each { evaluationDependsOn(it) }

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file("../run")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = file("../run")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            ltModuleProjects.each { dep -> sourceSet(project(dep).sourceSets.main) }
        }
    }

    // JUnit tests get the Minecraft + NeoForge classpath (needed to test
    // capability-adjacent logic like pipe conduction without booting the game).
    // Declared after the mods block: testedMod references mods."${mod_id}".
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}
configurations {
    developmentMods
}

def jeiCoord = "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
def geckolibCoord = "software.bernie.geckolib:geckolib-neoforge-${project.minecraft_version}:${project.geckolib_version}"
def imguiVersion = project.imgui_version
def lwjglVersion = project.lwjgl_version

dependencies {
    compileOnly jeiCoord
    developmentMods jeiCoord

    implementation geckolibCoord
    developmentMods geckolibCoord

    // Embed all submodules into the single output jar via NeoForge Jar-in-Jar
    jarJar geckolibCoord
    // Also needed at compile time
    ltModuleProjects.each { dep ->
        jarJar(project(dep))
        implementation project(dep)
    }

    // SPIRV-Cross for user-authored SPIR-V translation (Shaders:registerSpirvPass).
    // The Java part ships inside the mod jar; natives ride the dev classpath.
    // Production native bundling is a follow-up — without natives that path
    // fails loudly and GLSL stays fully working.
    jarJar "org.lwjgl:lwjgl-spvc:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-spvc:${lwjglVersion}"
    runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-windows"

    // Dear ImGui for in-game GUI Editor
    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation("io.github.spair:imgui-java-lwjgl3:${imguiVersion}") {
        exclude group: 'org.lwjgl'
    }
    runtimeOnly "io.github.spair:imgui-java-natives-windows:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:${imguiVersion}"
    jarJar "io.github.spair:imgui-java-binding:${imguiVersion}"
    jarJar("io.github.spair:imgui-java-lwjgl3:${imguiVersion}") {
        exclude group: 'org.lwjgl'
    }
    jarJar "io.github.spair:imgui-java-natives-windows:${imguiVersion}"
    jarJar "io.github.spair:imgui-java-natives-linux:${imguiVersion}"
    jarJar "io.github.spair:imgui-java-natives-macos:${imguiVersion}"
    runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-macos"

    // JEI integration for checking recipes in-game easily
    implementation jeiCoord

    // FML runtime classpath overrides for dev environment
    additionalRuntimeClasspath "io.github.kienpc1234:luava:${luava_version}"
    additionalRuntimeClasspath "org.mongodb:bson:${project.bson_version}"

    testImplementation "io.github.kienpc1234:luava:${luava_version}"
    testImplementation "org.mongodb:bson:${project.bson_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${project.junit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${project.junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.google.code.gson:gson:${project.gson_version}"
}

test {
    useJUnitPlatform()
    maxHeapSize = '2048m'
}

var copyDevelopmentMods = tasks.register('copyDevelopmentMods', Copy) {
    from configurations.developmentMods
    into file("run/mods")
}

var syncLuaMods = tasks.register('syncLuaMods', Sync) {
    from file("luamods")
    into file("../run/luamods")
    preserve {
        include ".luatweaker/**"
    }
}

var syncLuaConfig = tasks.register('syncLuaConfig', Sync) {
    from file("luaconfig")
    into file("../run/luaconfig")
}

tasks.named('processResources') {
    dependsOn copyDevelopmentMods
}

tasks.named('runClient') {
    dependsOn rootProject.getTasksByName('classes', true)
    dependsOn syncLuaMods
    dependsOn syncLuaConfig
}

tasks.named('runServer') {
    dependsOn rootProject.getTasksByName('classes', true)
    dependsOn syncLuaMods
    dependsOn syncLuaConfig
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask copyDevelopmentMods
neoForge.ideSyncTask syncLuaMods
neoForge.ideSyncTask syncLuaConfig
