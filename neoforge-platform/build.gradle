plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

evaluationDependsOn(':common-api')
evaluationDependsOn(':core-engine')
evaluationDependsOn(':modules:module-recipes')
evaluationDependsOn(':modules:module-content')
evaluationDependsOn(':modules:module-entities')
evaluationDependsOn(':modules:module-interaction')
evaluationDependsOn(':modules:module-events')
evaluationDependsOn(':modules:module-math')
evaluationDependsOn(':modules:module-storage')
evaluationDependsOn(':modules:module-network')
evaluationDependsOn(':modules:module-client')
evaluationDependsOn(':modules:module-interception')
evaluationDependsOn(':modules:module-command')
evaluationDependsOn(':modules:module-tasks')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file("../run")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = file("../run")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common-api').sourceSets.main)
            sourceSet(project(':core-engine').sourceSets.main)
            sourceSet(project(':modules:module-recipes').sourceSets.main)
            sourceSet(project(':modules:module-content').sourceSets.main)
            sourceSet(project(':modules:module-entities').sourceSets.main)
            sourceSet(project(':modules:module-interaction').sourceSets.main)
            sourceSet(project(':modules:module-events').sourceSets.main)
            sourceSet(project(':modules:module-math').sourceSets.main)
            sourceSet(project(':modules:module-storage').sourceSets.main)
            sourceSet(project(':modules:module-network').sourceSets.main)
            sourceSet(project(':modules:module-client').sourceSets.main)
            sourceSet(project(':modules:module-interception').sourceSets.main)
            sourceSet(project(':modules:module-tasks').sourceSets.main)
sourceSet(project(':modules:module-command').sourceSets.main)
        }
    }
}
configurations {
    developmentMods
}

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.32.0.359"
    developmentMods "mezz.jei:jei-1.21.1-neoforge:19.32.0.359"

    // Embed all submodules into the single output jar via NeoForge Jar-in-Jar
    jarJar(project(':common-api'))
    jarJar(project(':core-engine'))
    jarJar(project(':modules:module-recipes'))
    jarJar(project(':modules:module-content'))
    jarJar(project(':modules:module-entities'))
    jarJar(project(':modules:module-interaction'))
    jarJar(project(':modules:module-events'))
    jarJar(project(':modules:module-math'))
    jarJar(project(':modules:module-storage'))
    jarJar(project(':modules:module-network'))
    jarJar(project(':modules:module-client'))
    jarJar(project(':modules:module-interception'))
    jarJar(project(':modules:module-tasks'))
jarJar(project(':modules:module-command'))

    // Also needed at compile time
    implementation project(':common-api')
    implementation project(':core-engine')
    implementation project(':modules:module-recipes')
    implementation project(':modules:module-content')
    implementation project(':modules:module-entities')
    implementation project(':modules:module-interaction')
    implementation project(':modules:module-events')
    implementation project(':modules:module-math')
    implementation project(':modules:module-storage')
    implementation project(':modules:module-network')
    implementation project(':modules:module-client')
    implementation project(':modules:module-interception')
    implementation project(':modules:module-tasks')
implementation project(':modules:module-command')

    // JEI integration for checking recipes in-game easily
    implementation "mezz.jei:jei-1.21.1-neoforge:19.32.0.359"

    // FML runtime classpath overrides for dev environment
    additionalRuntimeClasspath "cc.tweaked:cobalt:0.9.9"
    additionalRuntimeClasspath "org.mongodb:bson:5.1.0"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var copyDevelopmentMods = tasks.register('copyDevelopmentMods', Copy) {
    from configurations.developmentMods
    into file("run/mods")
}

var syncLuaMods = tasks.register('syncLuaMods', Sync) {
    from file("luamods")
    into file("../run/luamods")
    preserve {
        include ".luatweaker/**"
    }
}

var syncLuaConfig = tasks.register('syncLuaConfig', Sync) {
    from file("luaconfig")
    into file("../run/luaconfig")
}

tasks.named('processResources') {
    dependsOn copyDevelopmentMods
}

tasks.named('runClient') {
    dependsOn rootProject.getTasksByName('classes', true)
    dependsOn syncLuaMods
    dependsOn syncLuaConfig
}

tasks.named('runServer') {
    dependsOn rootProject.getTasksByName('classes', true)
    dependsOn syncLuaMods
    dependsOn syncLuaConfig
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask copyDevelopmentMods
neoForge.ideSyncTask syncLuaMods
neoForge.ideSyncTask syncLuaConfig

